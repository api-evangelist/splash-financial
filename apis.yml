aid: splash-financial
name: Splash Financial
description: 'Splash Financial is a Cleveland, Ohio financial technology company and
  online lending marketplace, founded in 2013, that matches consumers with loan offers
  from a network of partner banks and credit unions rather than lending directly itself.
  The platform uses automated underwriting to prequalify borrowers and present competing
  offers across student loan refinancing, personal loans, debt consolidation, home
  equity lines of credit, in-school private student loans, and medical school loan
  refinancing. The company reports having helped more than 125,000 people refinance
  over $6 billion in loans. Splash also sells its origination technology to credit
  unions and community banks as a partner channel, but that integration is arranged
  through a business development contact form and no public developer portal, API
  reference, or machine-readable specification is published.'
